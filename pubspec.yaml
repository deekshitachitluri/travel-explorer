name: travel_explorer
description: "A complete, modern Travel Explorer application built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  crypto: ^3.0.7
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/destinations/
    - assets/images/attractions/
